<!DOCTYPE html>
<html>
<head>
    <title>Azure Blob Uploader</title>
    <style>
        .container { padding: 20px; font-family: Arial, sans-serif; }
        .input-group { margin-bottom: 15px; }
        input, button { padding: 8px; margin: 5px 0; }
        #results { margin-top: 20px; max-height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; }
        .mode-toggle { margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Azure Blob Uploader</h2>
        <div class="input-group">
            <label>Connection String:</label><br>
            <input type="text" id="connectionString" style="width: 100%;">
        </div>
        <div class="input-group">
            <label>Container Name:</label><br>
            <input type="text" id="containerName" style="width: 100%;">
        </div>
        <div class="input-group">
            <div class="mode-toggle">
                <label><input type="radio" name="mode" value="files" checked> Select Files</label>
                <label><input type="radio" name="mode" value="folders"> Select Folders</label>
            </div>
            <button onclick="selectFiles()">Select Files/Folders</button>
            <button onclick="uploadFiles()" id="uploadButton" disabled>Upload</button>
            <button onclick="cancelUpload()" id="cancelButton" disabled>Cancel</button>
        </div>
        <div id="results"></div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let selectedFiles = [];

        function selectFiles() {
            const mode = document.querySelector('input[name="mode"]:checked').value;
            ipcRenderer.send('select-files', mode);
        }

        ipcRenderer.on('files-selected', (event, files) => {
            selectedFiles = files;
            document.getElementById('results').innerHTML = `Selected: ${files.length} items`;
            document.getElementById('uploadButton').disabled = false;
            document.getElementById('cancelButton').disabled = true;
        });

        function uploadFiles() {
            const connectionString = document.getElementById('connectionString').value;
            const containerName = document.getElementById('containerName').value;

            if (!connectionString || !containerName || selectedFiles.length === 0) {
                alert('Please fill all fields and select files or folders');
                return;
            }

            document.getElementById('results').innerHTML = 'Uploading...';
            document.getElementById('uploadButton').disabled = true;
            document.getElementById('cancelButton').disabled = false;
            ipcRenderer.send('upload-files', {
                connection_string: connectionString,
                container_name: containerName,
                files: selectedFiles
            });
        }

        function cancelUpload() {
            ipcRenderer.send('cancel-upload');
        }

        ipcRenderer.on('upload-result', (event, results) => {
            const resultsDiv = document.getElementById('results');
            document.getElementById('uploadButton').disabled = false;
            document.getElementById('cancelButton').disabled = true;
            if (results.error) {
                resultsDiv.innerHTML = `Error: ${results.error}`;
            } else {
                resultsDiv.innerHTML = Object.values(results)
                    .map(result => `<div>${result}</div>`)
                    .join('');
            }
        });
    </script>
</body>
</html>
